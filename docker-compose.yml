services:
  # App service (if running API in docker)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: dcd_api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - .:/app
      - /app/tmp
    environment:
      - PORT=${PORT:-8080}
      - DB_HOST=psql_bp
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-dcd_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_SCHEMA=public
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - S3_ENDPOINT=http://minio:9000
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_CURRENCY=${STRIPE_CURRENCY}
    depends_on:
      psql_bp:
        condition: service_healthy
    networks:
      - dcd_network

  # Database generated by go-blueprint
  psql_bp:
    image: postgres:16-alpine
    container_name: dcd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dcd_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - psql_bp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-dcd_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dcd_network

  # Mailpit (Email inbox UI)
  mailpit:
    image: axllent/mailpit:latest
    container_name: dcd_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - dcd_network

  # MinIO (S3 Object Storage for vehicle before/after photos)
  minio:
    image: minio/minio:latest
    container_name: dcd_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - dcd_network


networks:
  dcd_network:
    driver: bridge

volumes:
  psql_bp_data:
  minio_data: