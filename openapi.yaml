openapi: 3.0.3
info:
  title: Demon Car Detailing (DCD) API
  description: Backend API for managing car detailing service packages and client reservations.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server
  - url: https://dcd-be.vercel.app
    description: Production Server
paths:
  /api/v1/health:
    get:
      summary: Health check
      description: Returns health status of the application and its database connection.
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: up
                  message:
                    type: string
                    example: DCD database is healthy
        '500':
          description: Internal database error or server down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "DCD database is unhealthy"

  /api/v1/ping:
    get:
      summary: Ping
      description: A simple ping endpoint to test server responsiveness.
      responses:
        '200':
          description: Pong response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: pong



  /api/v1/services:
    get:
      summary: List services
      description: Returns a list of parent service packages with their nested subtypes.
      responses:
        '200':
          description: List of service packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServicePackage'
              example:
                - id: 1
                  slug: "deep-clean-valet"
                  name: "Deep Clean Valet"
                  category: "VALETING"
                  base_price: 140.00
                  duration_min: 240
                  description: "A full interior and exterior reset — every panel, vent and seam."
                  created_at: "2026-08-27T11:25:36Z"
        '500':
          description: Failed to retrieve services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to retrieve services"

  /api/v1/services/{slug}:
    get:
      summary: Get service by slug
      description: Retrieves a single service package and its subtypes using its unique slug.
      parameters:
        - name: slug
          in: path
          required: true
          description: Service package slug (e.g. "paint-protection-film")
          schema:
            type: string
      responses:
        '200':
          description: Service package details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePackage'
              example:
                id: 6
                slug: "paint-protection-film"
                name: "Paint Protection Film (PPF)"
                category: "PROTECTION"
                base_price: 0.00
                duration_min: 0
                description: "SunTek film that shields paint from stone chips and scratches."
                subtypes:
                  - id: 10
                    parent_id: 6
                    slug: "ppf-front-end"
                    name: "Front End Coverage"
                    category: "PROTECTION"
                    base_price: 1395.00
                    duration_min: 480
                    description: "Protects high-impact areas: front bumper, hood, fenders, and mirrors."
                    created_at: "2026-08-27T11:25:36Z"
                created_at: "2026-08-27T11:25:36Z"
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Service not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to retrieve service"

  /api/v1/reservations:
    post:
      summary: Create reservation
      description: Submits a new client reservation request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Reservation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
              example:
                id: 1
                name: "John Doe"
                contact: "john@example.com"
                service: "Deep Clean Valet"
                date: "2026-09-01T10:00:00Z"
                message: "Needs interior detailing"
                created_at: "2026-08-27T11:31:49.983682Z"
                updated_at: "2026-08-27T11:31:49.983682Z"
        '400':
          description: Invalid input parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Key: 'CreateReservationRequest.Name' Error:Field validation for 'Name' failed on the 'required' tag"
        '409':
          description: Timeslot conflict or duplicate customer booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateBooking:
                  summary: Duplicate booking by same client
                  value:
                    error: "reservation already exists for this client at this time"
                slotTaken:
                  summary: Timeslot already reserved
                  value:
                    error: "timeslot is already reserved"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to store reservation"

    get:
      summary: List reservations (public)
      description: Exposes booked dates and times to block them on the frontend calendar widget. Contains no customer details.
      responses:
        '200':
          description: Booked timeslots list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicReservation'
              example:
                - date: "2026-09-01T10:00:00Z"
                - date: "2026-09-05T14:00:00Z"
        '500':
          description: Failed to retrieve public reservations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to retrieve public reservations"

  /api/v1/admin/reservations:
    get:
      summary: List reservations (admin)
      description: Returns the full list of all reservations with customer details.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Full list of detailed reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
              example:
                - id: 1
                  name: "John Doe"
                  contact: "john@example.com"
                  service: "Deep Clean Valet"
                  date: "2026-09-01T10:00:00Z"
                  message: "Needs interior detailing"
                  created_at: "2026-08-27T11:31:49.983682Z"
                  updated_at: "2026-08-27T11:31:49.983682Z"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized"
        '500':
          description: Failed to retrieve admin reservations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Failed to retrieve admin reservations"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Unauthorized"

    ServicePackage:
      type: object
      properties:
        id:
          type: integer
          example: 6
        parent_id:
          type: integer
          nullable: true
          example: null
        slug:
          type: string
          example: "paint-protection-film"
        name:
          type: string
          example: "Paint Protection Film (PPF)"
        category:
          type: string
          example: "PROTECTION"
        base_price:
          type: number
          format: float
          example: 0.00
        duration_min:
          type: integer
          example: 0
        description:
          type: string
          example: "SunTek film that shields paint from stone chips and scratches."
        subtypes:
          type: array
          items:
            $ref: '#/components/schemas/ServicePackage'
        created_at:
          type: string
          format: date-time
          example: "2026-08-27T11:25:36Z"

    CreateReservationRequest:
      type: object
      required:
        - name
        - contact
        - service
        - date
      properties:
        name:
          type: string
          example: "John Doe"
        contact:
          type: string
          example: "john@example.com"
        service:
          type: string
          example: "Deep Clean Valet"
        date:
          type: string
          format: date-time
          description: Must be in RFC3339 layout (e.g. 2006-01-02T15:04:05Z07:00)
          example: "2026-09-01T10:00:00Z"
        message:
          type: string
          example: "Needs interior detailing"

    Reservation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "John Doe"
        contact:
          type: string
          example: "john@example.com"
        service:
          type: string
          example: "Deep Clean Valet"
        date:
          type: string
          format: date-time
          example: "2026-09-01T10:00:00Z"
        message:
          type: string
          example: "Needs interior detailing"
        created_at:
          type: string
          format: date-time
          example: "2026-08-27T11:31:49.983682Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-08-27T11:31:49.983682Z"

    PublicReservation:
      type: object
      properties:
        date:
          type: string
          format: date-time
          example: "2026-09-01T10:00:00Z"
